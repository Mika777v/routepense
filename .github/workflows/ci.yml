name: ci

# すべての PR と main への push で動くゲート。
# main の必須チェックは ci-ok と pr-title（conventional-commits）の2つだけにする（scripts/github/setup-repo.sh）。
# チェックを増やすときは checks ジョブに足すか、新しいジョブを作って ci-ok の needs に加える。
# そうすればリポジトリの設定（Ruleset）を変えずに済む。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # まだ package.json が無い（雛形を作る前の）段階では、Node のチェックを飛ばす
      - name: Detect Node project
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
            echo "package.json が無いため、Node のチェックを飛ばします"
          fi

      - uses: actions/setup-node@v7
        if: steps.detect.outputs.node == 'true'
        with:
          node-version: "24"
          cache: npm

      - name: Install
        if: steps.detect.outputs.node == 'true'
        run: npm ci

      - name: Type check
        if: steps.detect.outputs.node == 'true'
        run: npm run typecheck --if-present

      - name: Lint
        if: steps.detect.outputs.node == 'true'
        run: npm run lint --if-present

      - name: Test
        if: steps.detect.outputs.node == 'true'
        run: npm run test --if-present

  # 必須チェック。スキップされたジョブは成功扱い、失敗・キャンセルがあれば失敗にする
  ci-ok:
    if: always()
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "results: $RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            echo "::error::いずれかのチェックが失敗またはキャンセルされました"
            exit 1
          fi
