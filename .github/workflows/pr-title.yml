name: pr-title

# PR タイトルが Conventional Commits の形式かを確かめる。
# スカッシュマージでは PR タイトルがそのまま main のコミットメッセージになるため、ここで形式をそろえる。
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    steps:
      # サードパーティの Action はコミットのハッシュで固定する（v6.1.1）
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            frontend
            backend
            shared
            db
            docs
            textbook
            ci
            deps
          requireScope: false
          # 日本語の subject を許可するため、大文字小文字の規則は課さない
          subjectPattern: ^.+$
